# Constrói a imagem do site e publica no GitHub Container Registry, em
# ghcr.io/<dono-do-repositório>/snct2026 (o nome sai do próprio repositório).
#
# Tags geradas:
#   latest       a cada push na main
#   <branch>     a cada push em qualquer outro branch
#   sha-<curto>  sempre, para dar para voltar a uma versão exata
#   v1.2.3       quando se publica uma tag de versão
#
# Também dá para rodar na mão pela aba Actions (workflow_dispatch).

name: Imagem

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # O ghcr exige o nome em minúsculas; o metadata-action já converte.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max